name: Feature
description: Something new a pipeapi package should do, or a better way to do something it already does.
type: Feature
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What's missing or awkward, and for whom.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you'd build, in a few sentences or bullets.
    validations:
      required: true
  - type: textarea
    id: open-questions
    attributes:
      label: Open questions
      description: Decisions still to make, one checkbox each (`- [ ] ...`). Each is ticked when its answer is in the Proposal.
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Tradeoffs, risks and links.
