version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Denver
    cooldown:
      default-days: 7
    groups:
      github-actions:
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ['*']
    labels: ['area: ci']

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Denver
    cooldown:
      default-days: 7
    groups:
      pre-commit:
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ['*']
    labels: ['area: ci']

  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Denver
    # docs/.npmrc's min-release-age holds local installs to the same 7 days.
    cooldown:
      default-days: 7
    groups:
      # Starlight and its plugins require a matching Astro, so Astro's packages move together.
      astro:
        patterns: [astro, '@astrojs/*', 'starlight-*']
      # Likewise ESLint's plugins and configs, and Prettier's plugins.
      eslint:
        patterns: [eslint, '@eslint/*', 'eslint-plugin-*', typescript-eslint]
      prettier:
        patterns: [prettier, 'prettier-plugin-*']
      npm:
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ['*']
    labels: ['area: docs']

  # Every Python project in one entry, since a group moves a package only across its entry's
  # directories.
  - package-ecosystem: uv
    directories: [/conformance, /scripts]
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Denver
    # Each project's exclude-newer, in its pyproject.toml, holds local locks to the same 7 days.
    cooldown:
      default-days: 7
    groups:
      # The packages the projects share, each moved in every project by one pull request, so
      # ruff.base.toml and pyright.base.json move to each version of their tool together. A local
      # upgrade or a security update can still move one project alone.
      shared:
        patterns: [pyright, pyyaml, ruff, types-pyyaml]
        group-by: dependency-name
      uv:
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ['*']
    labels: ['area: protocol']
