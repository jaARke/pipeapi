version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Denver
    cooldown:
      default-days: 7
    groups:
      github-actions:
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ['*']
    labels: ['area: ci']

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Denver
    cooldown:
      default-days: 7
    groups:
      pre-commit:
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ['*']
    labels: ['area: ci']
