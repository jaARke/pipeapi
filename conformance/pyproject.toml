[project]
name = "pipeapi-conformance"
version = "0.0.0"
description = "pipeapi's conformance suite and the reference app it runs against."
# The one Python .python-version pins, since nothing here is published. The reference
# app alone is held to an older one, below.
requires-python = "==3.14.*"
dependencies = [
    "fastapi>=0.156.4",
    # Parses the requests the runner's fake server receives.
    "h11>=0.16.0",
    # The runner's and the baseline adapter's HTTP client, and Starlette's test client.
    "httpx2>=2.15.1",
    # Validates what the runner reads and receives against the schemas that define it.
    "jsonschema>=4.26.0",
    # The runner, which runs the conformance cases, and the project's tests.
    "pytest>=9.1.1",
    # FastAPI's form parsing, which the reference app's form route needs.
    "python-multipart>=0.0.32",
    # Ends by PID the backends a case learns of but didn't start, checking each is the
    # case's own first, on every platform.
    "psutil>=7.2.2",
    # Reads the case list, the adapters' manifests and the protocol's YAML files.
    "pyyaml>=6.0.3",
    # Resolves a schema's references to other files, for jsonschema's validators.
    "referencing>=0.37.0",
    # Serves the reference app, as the suite's baseline runs it.
    "uvicorn>=0.54.0",
    # uvicorn's WebSocket protocol, and the baseline adapter's and the tests' client.
    "websockets>=17.3",
]

[dependency-groups]
dev = [
    # Holds the reference app apart from the runner, the baseline adapter and the tests.
    "import-linter>=2.15",
    # The nodejs extra locks the Node runtime the wrapper runs pyright's bundled engine on.
    "pyright[nodejs]>=1.1.414",
    "ruff>=0.17.1",
    # Types for jsonschema, psutil and PyYAML, which ship none.
    "types-jsonschema>=4.26.0.20261006",
    "types-psutil>=7.2.2",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
# The oldest uv that keeps this lock's relative exclude-newer fixed (0.11.8) and can
# download the CPython .python-version pins (0.13.5), not the newest, so that
# Dependabot's uv, which lags the newest, can run. CI's conformance job runs this floor,
# and scripts/pyproject.toml holds the same one.
required-version = ">=0.13.5"
# The cooldown the uv entry in .github/dependabot.yml keeps, which names this setting,
# so no update proposes a version uv refuses.
exclude-newer = "7 days"

[tool.ruff]
# The rules every Python project shares.
extend = "../ruff.base.toml"
# The reference app is served in the pipeapi server's oldest supported environment, so
# it is held to that Python, which the justfile's reference_app_python holds for pyright;
# everything else runs on the pinned one.
per-file-target-version = { "reference_app/**/*.py" = "py310" }

[tool.ruff.lint.extend-per-file-ignores]
# The one reader of the environment.
"reference_app/environment.py" = ["TID251"]

# The direction of imports between the project's packages: the reference app serves
# pipeapi's server too, and the baseline adapter is a program of its own that speaks
# only the adapter protocol, so neither may lean on the suite's code.
[tool.importlinter]
root_packages = ["reference_app", "runner", "baseline_adapter", "tests"]

[[tool.importlinter.contracts]]
name = "The reference app imports nothing of the runner, the baseline adapter or the tests"
type = "forbidden"
source_modules = ["reference_app"]
forbidden_modules = ["runner", "baseline_adapter", "tests"]

[[tool.importlinter.contracts]]
name = "The baseline adapter imports nothing of the project's other packages"
type = "forbidden"
source_modules = ["baseline_adapter"]
forbidden_modules = ["reference_app", "runner", "tests"]

[[tool.importlinter.contracts]]
name = "The runner imports nothing of the baseline adapter or the tests"
type = "forbidden"
source_modules = ["runner"]
forbidden_modules = ["baseline_adapter", "tests"]

[tool.pyright]
# The type checking every Python project shares.
extends = "../pyright.base.json"
# The project's environment, whatever Python is first on PATH.
venvPath = "."
venv = ".venv"

[tool.pytest]
# The tests, the conformance suite's baseline run, and the examples in the docstrings,
# as doctests.
testpaths = ["tests", "reference_app", "runner"]
# So the tests and the runner import the project's packages by name.
pythonpath = ["."]
# Test modules imported by path, without changing sys.path, as pytest advises for new
# projects; and the docstrings' examples run.
addopts = ["--import-mode=importlib", "--doctest-modules"]
# An unknown setting or marker, or an xfail that passes, fails the run.
strict = true
# A warning, such as a dependency's deprecation, fails the test that raised it.
filterwarnings = ["error"]
